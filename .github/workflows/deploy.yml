name: Deploy site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Without this, Ruby defaults to US-ASCII and the CSS minifier raises
# "invalid byte sequence" on any accented character in the site.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Build
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
