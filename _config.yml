# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

first_name: Edimah
last_name: SYNESIUS SONGO

description: >
  Applied mathematician building reliable, mathematically grounded AI systems for regulated environments — Bayesian inference, optimisation, kernel methods, deep learning, signal processing.
keywords: applied mathematics, bayesian inference, statistical modelling, machine learning, AI evaluation, EU AI Act, uncertainty quantification, kernel methods, signal processing, public health, regulated systems
lang: en
icon: 🎶 # emoji used as the favicon

url: https://edimah.github.io
baseurl:
timezone: Europe/Paris

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Blog
blog_description: Statistical methods across domains, with one recurring question — how would I know whether to trust this?
permalink: /blog/:year/:title/
future: false # _scheduled/ plus the schedule-posts workflow publish future-dated posts on the day

pagination:
  enabled: true

# Year, tag and category archives under /blog/.
jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    layout: archive
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  posts:
    output: true

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

include: ["_pages"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-archives-v2
  - jekyll-feed
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "affiche"
    values:
      sitemap: false

jekyll-minifier:
  compress_javascript: true
