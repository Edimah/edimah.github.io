# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

first_name: Edimah
last_name: SYNESIUS SONGO

description: >
  Aspiring AI safety researcher, learning and testing things out.
keywords: AI safety, technical AI safety, model evaluation, applied mathematics, statistics, Bayesian inference, calibration, uncertainty quantification, data science, public health data
lang: en
icon: 🎶 # emoji used as the favicon

url: https://edimah.github.io
baseurl:
timezone: Europe/Paris

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Blog
permalink: /blog/:year/:title/
future: false # _scheduled/ plus the schedule-posts workflow publish future-dated posts on the day

pagination:
  enabled: true

# Year, tag and category archives under /blog/.
jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    layout: archive
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  posts:
    output: true

# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

include: ["_pages"]
exclude:
  - bin/
  - Dockerfile
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-archives-v2
  - jekyll-feed
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "affiche"
    values:
      sitemap: false

jekyll-minifier:
  # uglifier is ES5-only and chokes on the poster tool's modern JavaScript.
  # The site's own script is 881 bytes, so there is nothing to gain here.
  compress_javascript: false
  exclude:
    - "affiche/*"
    - "robots.txt"
